name: Apply emoji lists v2

on:
  push:
    branches:
      - feat/separate-task-child-emojis
    paths:
      - .github/workflows/apply-emoji-lists-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/separate-task-child-emojis
          fetch-depth: 0
      - name: Apply source update
        run: |
          python -c "from pathlib import Path; p=Path('src/App.tsx'); s=p.read_text(); old=\"const WEEKDAYS = ['Søndag', 'Mandag', 'Tirsdag', 'Onsdag', 'Torsdag', 'Fredag', 'Lørdag']\\nconst EMOJIS = ['🦊', '🐙', '🐼', '🦁', '🐬', '🦄', '🚀', '🎨', '⚽', '🎧', '🌟', '🛹']\"; new=\"const WEEKDAYS = ['Søndag', 'Mandag', 'Tirsdag', 'Onsdag', 'Torsdag', 'Fredag', 'Lørdag']\\nconst CHILD_EMOJIS = ['🦊', '🐙', '🐼', '🦁', '🐬', '🦄', '🚀', '🎨', '⚽', '🎧', '🌟', '🛹']\\nconst TASK_EMOJIS = [\\n  '✨', '🧹', '🧽', '🧺', '🛏️', '🍽️',\\n  '🗑️', '📚', '🐕', '🌱', '🚿', '🚲',\\n  '🧸', '🧼', '🍳', '🥣', '🧤', '🪣',\\n  '🛒', '🧑‍🍳',\\n]\"; assert s.count(old)==1; s=s.replace(old,new,1); selector=\"{EMOJIS.map((emoji) => <option key={emoji}>{emoji}</option>)}\"; assert s.count(selector)==2; s=s.replace(selector,\"{TASK_EMOJIS.map((emoji) => <option key={emoji}>{emoji}</option>)}\",1); s=s.replace(selector,\"{CHILD_EMOJIS.map((emoji) => <option key={emoji}>{emoji}</option>)}\",1); p.write_text(s)"
          rm -f .github/workflows/apply-emoji-lists.yml .github/workflows/apply-emoji-lists-v2.yml
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add -- src/App.tsx .github/workflows/apply-emoji-lists.yml .github/workflows/apply-emoji-lists-v2.yml
          git commit -m "feat: separate task and child emoji choices"
          git push origin HEAD:feat/separate-task-child-emojis
