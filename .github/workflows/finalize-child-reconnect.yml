name: Finalize reconnect cleanup

on:
  push:
    branches:
      - fix/child-profile-reconnect
    paths:
      - .github/workflows/finalize-child-reconnect.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/child-profile-reconnect
          fetch-depth: 0
      - name: Apply cleanup
        run: |
          python -c "from pathlib import Path; p=Path('src/AuthGate.tsx'); s=p.read_text(); old=\"          window.history.replaceState({}, '', window.location.pathname)\\n          setInviteValue(window.location.href)\\n          setMode('invite')\\n\"; new=\"          const failedInviteUrl = window.location.href\\n          window.history.replaceState({}, '', window.location.pathname)\\n          setInviteValue(failedInviteUrl)\\n          setMode('invite')\\n\"; assert s.count(old) == 1; p.write_text(s.replace(old, new, 1))"
          rm -f .github/workflows/apply-child-reconnect.yml .github/workflows/finalize-child-reconnect.yml
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add -- src/AuthGate.tsx .github/workflows/apply-child-reconnect.yml .github/workflows/finalize-child-reconnect.yml
          git commit -m "fix: preserve failed child invitation for retry"
          git push origin HEAD:fix/child-profile-reconnect
