name: Apply emoji list update
on: push
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/feat/separate-task-child-emojis'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/separate-task-child-emojis
          fetch-depth: 0
      - run: python scripts/apply_emoji_lists.py
      - run: rm -f .github/workflows/apply-emoji-lists.yml .github/workflows/apply-emoji-lists-v2.yml .github/workflows/apply-emoji-lists-v3.yml scripts/apply_emoji_lists.py
      - run: git config user.name "OpenAI Codex" && git config user.email "codex@openai.com" && git add -- src/App.tsx .github/workflows/apply-emoji-lists.yml .github/workflows/apply-emoji-lists-v2.yml .github/workflows/apply-emoji-lists-v3.yml scripts/apply_emoji_lists.py && git commit -m "feat: separate task and child emoji choices" && git push origin HEAD:feat/separate-task-child-emojis
