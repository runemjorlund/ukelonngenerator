name: Apply separated emoji lists

on:
  push:
    branches: [feat/separate-task-child-emojis]
    paths: [.github/workflows/apply-emoji-lists.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/separate-task-child-emojis
          fetch-depth: 0
      - name: Update emoji lists
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/App.tsx')
          text = path.read_text()

          old_lists = "const WEEKDAYS = ['Søndag', 'Mandag', 'Tirsdag', 'Onsdag', 'Torsdag', 'Fredag', 'Lørdag']\nconst EMOJIS = ['🦊', '🐙', '🐼', '🦁', '🐬', '🦄', '🚀', '🎨', '⚽', '🎧', '🌟', '🛹']"
          new_lists = """const WEEKDAYS = ['Søndag', 'Mandag', 'Tirsdag', 'Onsdag', 'Torsdag', 'Fredag', 'Lørdag']
const CHILD_EMOJIS = ['🦊', '🐙', '🐼', '🦁', '🐬', '🦄', '🚀', '🎨', '⚽', '🎧', '🌟', '🛹']
const TASK_EMOJIS = [
  '✨', '🧹', '🧽', '🧺', '🛏️', '🍽️',
  '🗑️', '📚', '🐕', '🌱', '🚿', '🚲',
  '🧸', '🧼', '🍳', '🥣', '🧤', '🪣',
  '🛒', '🧑‍🍳',
]"""

          if text.count(old_lists) != 1:
              raise SystemExit('Expected emoji list block exactly once')
          text = text.replace(old_lists, new_lists, 1)

          old_task = "{EMOJIS.map((emoji) => <option key={emoji}>{emoji}</option>)}"
          if text.count(old_task) != 2:
              raise SystemExit(f'Expected two emoji selector usages, found {text.count(old_task)}')
          text = text.replace(old_task, "{TASK_EMOJIS.map((emoji) => <option key={emoji}>{emoji}</option>)}", 1)
          text = text.replace(old_task, "{CHILD_EMOJIS.map((emoji) => <option key={emoji}>{emoji}</option>)}", 1)

          path.write_text(text)
          PY

          rm .github/workflows/apply-emoji-lists.yml
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add -- src/App.tsx .github/workflows/apply-emoji-lists.yml
          git commit -m "feat: separate task and child emoji choices"
          git push origin HEAD:feat/separate-task-child-emojis
