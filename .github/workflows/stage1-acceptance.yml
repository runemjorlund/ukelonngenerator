name: Stage 1 database acceptance

on:
  push:
    branches:
      - stage-1-database-migration
    paths:
      - .github/workflows/stage1-acceptance.yml

permissions:
  contents: write

jobs:
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage-1-database-migration
          fetch-depth: 0

      - name: Decode acceptance inputs
        run: |
          set -euo pipefail
          base64 -d .github/stage1/input/00_stub_supabase.sql.b64 > /tmp/00_stub_supabase.sql
          base64 -d .github/stage1/input/01_seed.sql.b64 > /tmp/01_seed.sql
          base64 -d .github/stage1/input/03_tester.sh.b64 > /tmp/03_tester.sh
          base64 -d .github/stage1/input/migration.sql.gz.b64 | gunzip > /tmp/202608060001_historikk_utbetaling_og_sletting.sql
          chmod +x /tmp/03_tester.sh
          python3 - <<'PY'
          from pathlib import Path
          path = Path('/tmp/03_tester.sh')
          lines = path.read_text().splitlines()
          lines = [
              'kjor() { PGPASSWORD="${PGPASSWORD:-postgres}" psql -h "${PGHOST:-localhost}" -U "${PGUSER:-postgres}" -X -q -t -A -d ok_test -c "$1" 2>&1; }'
              if line.startswith('kjor() {') else line
              for line in lines
          ]
          path.write_text('\n'.join(lines) + '\n')
          PY

      - name: Apply existing schema and realistic data
        run: |
          set -euo pipefail
          createdb ok_test
          for file in \
            /tmp/00_stub_supabase.sql \
            supabase/migrations/202607210001_family_app.sql \
            supabase/migrations/202608030001_fix_ios_auth_and_child_invites.sql \
            supabase/migrations/202608050001_child_profile_reconnect.sql \
            /tmp/01_seed.sql; do
            echo "Applying ${file}"
            psql -v ON_ERROR_STOP=1 -q -d ok_test -f "${file}"
          done
          psql -v ON_ERROR_STOP=1 -q -d ok_test <<'SQL'
          create table public._stage1_submission_snapshot as
          select id, family_id, task_id, child_member_id
          from public.submissions;
          SQL

      - name: Apply Stage 1 migration
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -q -d ok_test -f /tmp/202608060001_historikk_utbetaling_og_sletting.sql

      - name: Verify existing submission identity is preserved
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -q -d ok_test <<'SQL'
          do $$
          begin
            if exists (
              select 1
              from public._stage1_submission_snapshot before_row
              left join public.submissions after_row using (id)
              where after_row.id is null
                 or row(before_row.family_id, before_row.task_id, before_row.child_member_id)
                    is distinct from
                    row(after_row.family_id, after_row.task_id, after_row.child_member_id)
            ) then
              raise exception 'Migration deleted a submission or changed its family, task or child identity';
            end if;
          end;
          $$;
          drop table public._stage1_submission_snapshot;
          SQL

      - name: Verify rejected chores can be resubmitted safely
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -q -d ok_test <<'SQL'
          select set_config(
            'request.jwt.claims',
            '{"sub":"11111111-1111-1111-1111-111111111111","is_anonymous":false}',
            false
          );
          set role authenticated;
          update public.submissions
          set status = 'avvist',
              decided_at = now(),
              decided_by = (select id from public.family_members where display_name = 'Rune')
          where task_id = (select id from public.tasks where title = 'Rydde stua')
            and status = 'venter';
          reset role;

          create temp table rejected_snapshot as
          select id, family_id, task_id, child_member_id, amount_ore
          from public.submissions
          where task_id = (select id from public.tasks where title = 'Rydde stua')
            and status = 'avvist';
          grant select on rejected_snapshot to authenticated;

          select set_config(
            'request.jwt.claims',
            '{"sub":"22222222-2222-2222-2222-222222222222","is_anonymous":true}',
            false
          );
          set role authenticated;
          update public.submissions
          set status = 'venter'
          where id = (select id from rejected_snapshot);
          reset role;

          do $$
          begin
            if not exists (
              select 1
              from rejected_snapshot before_row
              join public.submissions after_row using (id)
              where after_row.status = 'venter'
                and after_row.decided_at is null
                and after_row.decided_by is null
                and after_row.payout_id is null
                and row(before_row.family_id, before_row.task_id, before_row.child_member_id, before_row.amount_ore)
                    is not distinct from
                    row(after_row.family_id, after_row.task_id, after_row.child_member_id, after_row.amount_ore)
            ) then
              raise exception 'Rejected submission was not safely returned to waiting';
            end if;
          end;
          $$;
          SQL

      - name: Run supplied 24 assertions
        run: |
          set -euo pipefail
          output=$(bash /tmp/03_tester.sh)
          printf '%s\n' "$output"
          grep -Fq 'Bestått: 24' <<<"$output"
          grep -Fq 'Feilet: 0' <<<"$output"

      - name: Publish only the verified migration
        run: |
          set -euo pipefail
          cp /tmp/202608060001_historikk_utbetaling_og_sletting.sql \
            supabase/migrations/202608060001_historikk_utbetaling_og_sletting.sql
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- \
            .github/stage1/migration.00.b64 \
            .github/stage1/input/00_stub_supabase.sql.b64 \
            .github/stage1/input/01_seed.sql.b64 \
            .github/stage1/input/03_tester.sh.b64 \
            .github/stage1/input/migration.sql.gz.b64 \
            .github/workflows/stage1-acceptance.yml
          git add -- supabase/migrations/202608060001_historikk_utbetaling_og_sletting.sql
          git commit -m "Legg til historikk, utbetaling og trygg sletting"
          git push origin HEAD:stage-1-database-migration
