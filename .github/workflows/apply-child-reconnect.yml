name: Finalize child reconnect implementation

on:
  push:
    branches: [fix/child-profile-reconnect]
    paths: [.github/workflows/apply-child-reconnect.yml]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/child-profile-reconnect
          fetch-depth: 0

      - name: Preserve failed invitation input and remove temporary workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/AuthGate.tsx')
          text = path.read_text()
          old = """          window.history.replaceState({}, '', window.location.pathname)
          setInviteValue(window.location.href)
          setMode('invite')
"""
          new = """          const failedInviteUrl = window.location.href
          window.history.replaceState({}, '', window.location.pathname)
          setInviteValue(failedInviteUrl)
          setMode('invite')
"""
          if text.count(old) != 1:
              raise SystemExit('AuthGate.tsx: failed invitation block not found exactly once')
          path.write_text(text.replace(old, new, 1))
          PY

          rm .github/workflows/apply-child-reconnect.yml

          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add -- src/AuthGate.tsx .github/workflows/apply-child-reconnect.yml
          git commit -m "fix: preserve failed child invitation for retry"
          git push origin HEAD:fix/child-profile-reconnect
